<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#111c38"/>
      <stop offset="100%" stop-color="#080d1a"/>
    </linearGradient>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#f5e086"/>
      <stop offset="100%" stop-color="#aa820a"/>
    </linearGradient>
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid1" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.04"/>
    </pattern>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="640" fill="url(#bgGrad1)"/>
  <rect width="480" height="640" fill="url(#grid1)"/>
  <circle cx="240" cy="290" r="180" fill="url(#glow1)"/>

  <!-- Outer Framing -->
  <rect x="20" y="20" width="440" height="600" fill="none" stroke="#d4af37" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="24" y="24" width="432" height="592" fill="none" stroke="#3b82f6" stroke-opacity="0.15" stroke-width="0.5"/>
  <circle cx="20" cy="20" r="3" fill="#d4af37" opacity="0.6"/>
  <circle cx="460" cy="20" r="3" fill="#d4af37" opacity="0.6"/>
  <circle cx="20" cy="620" r="3" fill="#d4af37" opacity="0.6"/>
  <circle cx="460" cy="620" r="3" fill="#d4af37" opacity="0.6"/>

  <!-- Top Header Tag -->
  <g transform="translate(44, 48)">
    <text font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="3" fill="#d4af37" text-anchor="start">SBM ITB • P3MD MBA COHORT</text>
    <text font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="8" font-weight="600" letter-spacing="2" fill="#94a3b8" text-anchor="end" x="392">14 WEEKS • 70-20-10</text>
    <line x1="0" y1="12" x2="392" y2="12" stroke="#d4af37" stroke-opacity="0.25" stroke-width="1"/>
  </g>

  <!-- Graphic Center: Organizational Network & Leadership Radar -->
  <g transform="translate(240, 290)">
    <!-- Concentric radar orbits -->
    <circle r="140" fill="none" stroke="#3b82f6" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="4 4"/>
    <circle r="105" fill="none" stroke="#3b82f6" stroke-opacity="0.2" stroke-width="1"/>
    <circle r="70" fill="none" stroke="#d4af37" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="2 2"/>
    <circle r="35" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1"/>

    <!-- Network Connection Lines -->
    <line x1="0" y1="-70" x2="-80" y2="-10" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="1.5"/>
    <line x1="0" y1="-70" x2="80" y2="-10" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="1.5"/>
    <line x1="-80" y1="-10" x2="-65" y2="70" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="1.5"/>
    <line x1="80" y1="-10" x2="65" y2="70" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="1.5"/>
    <line x1="-65" y1="70" x2="0" y2="105" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="1.5"/>
    <line x1="65" y1="70" x2="0" y2="105" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="1.5"/>

    <!-- Cross connections -->
    <line x1="0" y1="-70" x2="0" y2="0" stroke="#d4af37" stroke-opacity="0.4" stroke-width="1.5"/>
    <line x1="-80" y1="-10" x2="0" y2="0" stroke="#d4af37" stroke-opacity="0.4" stroke-width="1.5"/>
    <line x1="80" y1="-10" x2="0" y2="0" stroke="#d4af37" stroke-opacity="0.4" stroke-width="1.5"/>
    <line x1="-65" y1="70" x2="0" y2="0" stroke="#d4af37" stroke-opacity="0.4" stroke-width="1.5"/>
    <line x1="65" y1="70" x2="0" y2="0" stroke="#d4af37" stroke-opacity="0.4" stroke-width="1.5"/>
    <line x1="0" y1="105" x2="0" y2="0" stroke="#d4af37" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- Nodes -->
    <circle cx="0" cy="-70" r="7" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
    <circle cx="-80" cy="-10" r="6" fill="#1e40af" stroke="#93c5fd" stroke-width="1.5"/>
    <circle cx="80" cy="-10" r="6" fill="#1e40af" stroke="#93c5fd" stroke-width="1.5"/>
    <circle cx="-65" cy="70" r="5" fill="#1d4ed8" stroke="#93c5fd" stroke-width="1.5"/>
    <circle cx="65" cy="70" r="5" fill="#1d4ed8" stroke="#93c5fd" stroke-width="1.5"/>
    <circle cx="0" cy="105" r="5" fill="#1d4ed8" stroke="#93c5fd" stroke-width="1.5"/>

    <!-- Center Leadership Hub -->
    <circle cx="0" cy="0" r="16" fill="url(#goldGrad1)" filter="url(#shadow1)"/>
    <circle cx="0" cy="0" r="9" fill="#0b1329"/>
    <circle cx="0" cy="0" r="4" fill="#f5e086"/>

    <!-- Orbiting Micro Particles -->
    <circle cx="-110" cy="-60" r="2.5" fill="#d4af37" opacity="0.6"/>
    <circle cx="115" cy="-55" r="3" fill="#60a5fa" opacity="0.6"/>
    <circle cx="-100" cy="90" r="2" fill="#93c5fd" opacity="0.5"/>
    <circle cx="105" cy="85" r="2.5" fill="#d4af37" opacity="0.6"/>
  </g>

  <!-- Large Course Code Badge -->
  <g transform="translate(44, 115)">
    <rect x="0" y="0" width="82" height="28" rx="4" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1"/>
    <text x="41" y="18" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="2" fill="#60a5fa" text-anchor="middle">MK 01</text>
  </g>

  <!-- Title & Narrative Typography -->
  <g transform="translate(44, 460)">
    <text font-family="'Lora', Georgia, serif" font-size="25" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Organizational</text>
    <text y="32" font-family="'Lora', Georgia, serif" font-size="25" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Behaviour &amp;</text>
    <text y="64" font-family="'Lora', Georgia, serif" font-size="25" font-weight="700" fill="url(#goldGrad1)" letter-spacing="-0.5">Managing People</text>
    
    <text y="92" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.5" fill="#94a3b8">LEADERSHIP • TEAMS • TALENT ARCHITECTURE</text>
    
    <line x1="0" y1="108" x2="392" y2="108" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1"/>
    
    <text y="125" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="1" fill="#64748b">LEAD FACULTY</text>
    <text y="139" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">Muhammad Yorga Permana, Ph.D.</text>
  </g>
</svg>
