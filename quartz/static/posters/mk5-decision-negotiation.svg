<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1202"/>
      <stop offset="50%" stop-color="#3b1d03"/>
      <stop offset="100%" stop-color="#120901"/>
    </linearGradient>
    <linearGradient id="amberGrad5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="bronzeGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="glow5" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid5" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.04"/>
    </pattern>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="640" fill="url(#bgGrad5)"/>
  <rect width="480" height="640" fill="url(#grid5)"/>
  <circle cx="240" cy="290" r="180" fill="url(#glow5)"/>

  <!-- Outer Framing -->
  <rect x="20" y="20" width="440" height="600" fill="none" stroke="#d97706" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="24" y="24" width="432" height="592" fill="none" stroke="#fde047" stroke-opacity="0.15" stroke-width="0.5"/>
  <circle cx="20" cy="20" r="3" fill="#d97706" opacity="0.6"/>
  <circle cx="460" cy="20" r="3" fill="#d97706" opacity="0.6"/>
  <circle cx="20" cy="620" r="3" fill="#d97706" opacity="0.6"/>
  <circle cx="460" cy="620" r="3" fill="#d97706" opacity="0.6"/>

  <!-- Top Header Tag -->
  <g transform="translate(44, 48)">
    <text font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="3" fill="#fde047" text-anchor="start">SBM ITB • P3MD MBA COHORT</text>
    <text font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="8" font-weight="600" letter-spacing="2" fill="#94a3b8" text-anchor="end" x="392">14 WEEKS • 7 CASES • 7 ROLEPLAYS</text>
    <line x1="0" y1="12" x2="392" y2="12" stroke="#d97706" stroke-opacity="0.25" stroke-width="1"/>
  </g>

  <!-- Graphic Center: Decision Tree Matrix, AHP Synthesis & Negotiation ZOPA Overlap -->
  <g transform="translate(240, 275)">
    <!-- Negotiation ZOPA intersecting circles -->
    <circle cx="-40" cy="15" r="75" fill="#d97706" fill-opacity="0.15" stroke="#d97706" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="40" cy="15" r="75" fill="#f59e0b" fill-opacity="0.12" stroke="#fde047" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- Kepner-Tregoe & AHP Branching Decision Hierarchy -->
    <!-- Level 0 (Root) -->
    <circle cx="0" cy="-105" r="14" fill="url(#amberGrad5)" filter="url(#shadow5)"/>
    <circle cx="0" cy="-105" r="7" fill="#1f1202"/>
    <text x="0" y="-123" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#fde047" text-anchor="middle">ROOT ISSUE</text>

    <!-- Connectors L0 -> L1 -->
    <line x1="0" y1="-91" x2="-80" y2="-45" stroke="#d97706" stroke-opacity="0.5" stroke-width="2"/>
    <line x1="0" y1="-91" x2="80" y2="-45" stroke="#d97706" stroke-opacity="0.5" stroke-width="2"/>

    <!-- Level 1 (Criteria) -->
    <circle cx="-80" cy="-45" r="9" fill="#b45309" stroke="#fde047" stroke-width="1.5"/>
    <text x="-95" y="-42" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="8" font-weight="700" fill="#fde047" text-anchor="end">CRITERIA A</text>

    <circle cx="80" cy="-45" r="9" fill="#b45309" stroke="#fde047" stroke-width="1.5"/>
    <text x="95" y="-42" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="8" font-weight="700" fill="#fde047" text-anchor="start">CRITERIA B</text>

    <!-- Connectors L1 -> L2 -->
    <line x1="-80" y1="-36" x2="-120" y2="25" stroke="#d97706" stroke-opacity="0.4" stroke-width="1.5"/>
    <line x1="-80" y1="-36" x2="-40" y2="25" stroke="#d97706" stroke-opacity="0.4" stroke-width="1.5"/>
    <line x1="80" y1="-36" x2="40" y2="25" stroke="#d97706" stroke-opacity="0.4" stroke-width="1.5"/>
    <line x1="80" y1="-36" x2="120" y2="25" stroke="#d97706" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- Level 2 Options / BATNA Nodes -->
    <circle cx="-120" cy="25" r="6" fill="#78350f" stroke="#fbbf24" stroke-width="1.2"/>
    <circle cx="-40" cy="25" r="6" fill="#78350f" stroke="#fbbf24" stroke-width="1.2"/>
    <circle cx="40" cy="25" r="6" fill="#78350f" stroke="#fbbf24" stroke-width="1.2"/>
    <circle cx="120" cy="25" r="6" fill="#78350f" stroke="#fbbf24" stroke-width="1.2"/>

    <!-- Integrative Bargaining ZOPA Diamond Core -->
    <polygon points="0,0 22,15 0,30 -22,15" fill="url(#amberGrad5)" stroke="#ffffff" stroke-width="1.5" filter="url(#shadow5)"/>
    <text x="0" y="45" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="8" font-weight="800" fill="#fde047" text-anchor="middle">ZOPA</text>

    <!-- Conceptual Annotations -->
    <text x="-135" y="-120" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#fde047" fill-opacity="0.75">KEPNER-TREGOE: SA • PA • DA • PPA</text>
    <text x="-135" y="115" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#fbbf24" fill-opacity="0.75">AHP • SMART • BATNA STRATEGY</text>
  </g>

  <!-- Large Course Code Badge -->
  <g transform="translate(44, 115)">
    <rect x="0" y="0" width="82" height="28" rx="4" fill="#d97706" fill-opacity="0.15" stroke="#d97706" stroke-opacity="0.4" stroke-width="1"/>
    <text x="41" y="18" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="2" fill="#fbbf24" text-anchor="middle">MK 05</text>
  </g>

  <!-- Title & Narrative Typography -->
  <g transform="translate(44, 460)">
    <text font-family="'Lora', Georgia, serif" font-size="25" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Problem Solving,</text>
    <text y="32" font-family="'Lora', Georgia, serif" font-size="25" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Decision Making &amp;</text>
    <text y="64" font-family="'Lora', Georgia, serif" font-size="25" font-weight="700" fill="url(#amberGrad5)" letter-spacing="-0.5">Negotiation</text>
    
    <text y="92" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.5" fill="#94a3b8">KEPNER-TREGOE • AHP • INTEGRATIVE BARGAINING</text>
    
    <line x1="0" y1="108" x2="392" y2="108" stroke="#d97706" stroke-opacity="0.3" stroke-width="1"/>
    
    <text y="125" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="1" fill="#64748b">LEAD FACULTY</text>
    <text y="139" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">Dr. Valid Hasyimi</text>
  </g>
</svg>
