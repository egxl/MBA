    <circle cx="-40" cy="-90" r="5" fill="#4f46e5" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="40" cy="-90" r="5" fill="#4f46e5" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="100" cy="-50" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="-80" cy="40" r="5" fill="#4f46e5" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="80" cy="40" r="5" fill="#4f46e5" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="0" cy="70" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>

