  <rect x="24" y="24" width="432" height="592" fill="none" stroke="#818cf8" stroke-opacity="0.15" stroke-width="0.5"/>
  <circle cx="20" cy="20" r="3" fill="#38bdf8" opacity="0.6"/>
  <circle cx="460" cy="20" r="3" fill="#38bdf8" opacity="0.6"/>
  <circle cx="20" cy="620" r="3" fill="#38bdf8" opacity="0.6"/>
