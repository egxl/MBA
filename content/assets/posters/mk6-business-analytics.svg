    <circle cx="0" cy="-40" r="9" fill="#070b24"/>
    <circle cx="0" cy="-40" r="4" fill="#38bdf8"/>

    <!-- Data Analytics Equations & Tags -->
    <text x="-135" y="-120" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#38bdf8" fill-opacity="0.8">ŷ = β₀ + β₁X₁ + ... + βₖXₖ + ε</text>
    <text x="-135" y="115" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#818cf8" fill-opacity="0.8">BIG DATA • ETHICS • BI VISUALIZATION</text>
