    <text y="32" font-family="'Lora', Georgia, serif" font-size="25" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Business</text>
    <text y="64" font-family="'Lora', Georgia, serif" font-size="25" font-weight="700" fill="url(#cyanGrad6)" letter-spacing="-0.5">Analytics</text>
    
    <text y="92" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.5" fill="#94a3b8">PREDICTIVE MODELS • BIG DATA • BI VISUALIZATION</text>
    
    <line x1="0" y1="108" x2="392" y2="108" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
    
    <text y="125" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="1" fill="#64748b">LEAD FACULTY</text>
    <text y="139" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">Dr. Eng. Manahan Siallagan</text>
