<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240610"/>
      <stop offset="50%" stop-color="#3d0a1b"/>
      <stop offset="100%" stop-color="#140208"/>
    </linearGradient>
    <linearGradient id="roseGoldGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="crimsonGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <radialGradient id="glow3" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid3" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.04"/>
    </pattern>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="640" fill="url(#bgGrad3)"/>
  <rect width="480" height="640" fill="url(#grid3)"/>
  <circle cx="240" cy="290" r="180" fill="url(#glow3)"/>

  <!-- Outer Framing -->
  <rect x="20" y="20" width="440" height="600" fill="none" stroke="#f43f5e" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="24" y="24" width="432" height="592" fill="none" stroke="#f59e0b" stroke-opacity="0.15" stroke-width="0.5"/>
  <circle cx="20" cy="20" r="3" fill="#f43f5e" opacity="0.6"/>
  <circle cx="460" cy="20" r="3" fill="#f43f5e" opacity="0.6"/>
  <circle cx="20" cy="620" r="3" fill="#f43f5e" opacity="0.6"/>
  <circle cx="460" cy="620" r="3" fill="#f43f5e" opacity="0.6"/>

  <!-- Top Header Tag -->
  <g transform="translate(44, 48)">
    <text font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="3" fill="#fda4af" text-anchor="start">SBM ITB • P3MD MBA COHORT</text>
    <text font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="8" font-weight="600" letter-spacing="2" fill="#94a3b8" text-anchor="end" x="392">14 WEEKS • 13 CASES • 1 GAME</text>
    <line x1="0" y1="12" x2="392" y2="12" stroke="#f43f5e" stroke-opacity="0.25" stroke-width="1"/>
  </g>

  <!-- Graphic Center: Customer Segmentation Radar, Brand Prism & 4Ps Dynamic Core -->
  <g transform="translate(240, 285)">
    <!-- STP Target Rings -->
    <circle r="135" fill="none" stroke="#f43f5e" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="6 4"/>
    <circle r="100" fill="none" stroke="#f43f5e" stroke-opacity="0.22" stroke-width="1"/>
    <circle r="65" fill="none" stroke="#fda4af" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="3 3"/>
    <circle r="32" fill="none" stroke="#f59e0b" stroke-opacity="0.45" stroke-width="1.5"/>

    <!-- Crosshair axes for Positioning Matrix -->
    <line x1="-145" y1="0" x2="145" y2="0" stroke="#f43f5e" stroke-opacity="0.25" stroke-width="1"/>
    <line x1="0" y1="-145" x2="0" y2="145" stroke="#f43f5e" stroke-opacity="0.25" stroke-width="1"/>

    <!-- Brand Prism Polygon -->
    <polygon points="0,-85 75,-35 60,65 -60,65 -75,-35" fill="#f43f5e" fill-opacity="0.12" stroke="url(#roseGoldGrad3)" stroke-width="2" filter="url(#shadow3)"/>
    <polygon points="0,-50 45,-20 35,40 -35,40 -45,-20" fill="none" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.2"/>

    <!-- The 4Ps Nodes & Customer Centricity Core -->
    <circle cx="0" cy="-85" r="7" fill="#e11d48" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="-98" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#fda4af" text-anchor="middle">PRODUCT</text>

    <circle cx="75" cy="-35" r="7" fill="#e11d48" stroke="#ffffff" stroke-width="2"/>
    <text x="96" y="-31" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#fda4af" text-anchor="start">PRICE</text>

    <circle cx="60" cy="65" r="7" fill="#e11d48" stroke="#ffffff" stroke-width="2"/>
    <text x="76" y="78" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#fda4af" text-anchor="start">PLACE</text>

    <circle cx="-60" cy="65" r="7" fill="#e11d48" stroke="#ffffff" stroke-width="2"/>
    <text x="-76" y="78" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#fda4af" text-anchor="end">PROMOTION</text>

    <!-- Center Customer Value Bullseye -->
    <circle cx="0" cy="0" r="16" fill="url(#roseGoldGrad3)" filter="url(#shadow3)"/>
    <circle cx="0" cy="0" r="9" fill="#240610"/>
    <circle cx="0" cy="0" r="4" fill="#fda4af"/>
    
    <!-- Strategic Annotations -->
    <text x="-135" y="-120" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#fda4af" fill-opacity="0.7">STP: SEGMENTATION • TARGET • POSITION</text>
    <text x="-135" y="125" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#f59e0b" fill-opacity="0.7">CUSTOMER LIFETIME VALUE (CLV)</text>
  </g>

  <!-- Large Course Code Badge -->
  <g transform="translate(44, 115)">
    <rect x="0" y="0" width="82" height="28" rx="4" fill="#f43f5e" fill-opacity="0.15" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1"/>
    <text x="41" y="18" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="2" fill="#fb7185" text-anchor="middle">MK 03</text>
  </g>

  <!-- Title & Narrative Typography -->
  <g transform="translate(44, 460)">
    <text font-family="'Lora', Georgia, serif" font-size="25" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Marketing</text>
    <text y="36" font-family="'Lora', Georgia, serif" font-size="25" font-weight="700" fill="url(#roseGoldGrad3)" letter-spacing="-0.5">Management</text>
    
    <text y="70" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.5" fill="#94a3b8">CUSTOMER VALUE • STP • 4PS &amp; BRANDING</text>
    
    <line x1="0" y1="90" x2="392" y2="90" stroke="#f43f5e" stroke-opacity="0.3" stroke-width="1"/>
    
    <text y="110" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="1" fill="#64748b">LEAD FACULTY</text>
    <text y="126" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">Ira Fachira, Ph.D.</text>
  </g>
</svg>
