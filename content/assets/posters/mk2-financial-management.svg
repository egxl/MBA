<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02211d"/>
      <stop offset="50%" stop-color="#063a34"/>
      <stop offset="100%" stop-color="#011412"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="emeraldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid2" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.04"/>
    </pattern>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="640" fill="url(#bgGrad2)"/>
  <rect width="480" height="640" fill="url(#grid2)"/>
  <circle cx="240" cy="290" r="180" fill="url(#glow2)"/>

  <!-- Outer Framing -->
  <rect x="20" y="20" width="440" height="600" fill="none" stroke="#eab308" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="24" y="24" width="432" height="592" fill="none" stroke="#10b981" stroke-opacity="0.15" stroke-width="0.5"/>
  <circle cx="20" cy="20" r="3" fill="#eab308" opacity="0.6"/>
  <circle cx="460" cy="20" r="3" fill="#eab308" opacity="0.6"/>
  <circle cx="20" cy="620" r="3" fill="#eab308" opacity="0.6"/>
  <circle cx="460" cy="620" r="3" fill="#eab308" opacity="0.6"/>

  <!-- Top Header Tag -->
  <g transform="translate(44, 48)">
    <text font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="3" fill="#eab308" text-anchor="start">SBM ITB • P3MD MBA COHORT</text>
    <text font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="8" font-weight="600" letter-spacing="2" fill="#94a3b8" text-anchor="end" x="392">14 WEEKS • 70-20-10</text>
    <line x1="0" y1="12" x2="392" y2="12" stroke="#eab308" stroke-opacity="0.25" stroke-width="1"/>
  </g>

  <!-- Graphic Center: Financial Yield Curves, Valuation Bars & TVM Geometric Horizon -->
  <g transform="translate(240, 280)">
    <!-- Coordinate axis grid -->
    <line x1="-140" y1="90" x2="140" y2="90" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
    <line x1="-140" y1="-100" x2="-140" y2="90" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Valuation Candlestick / Bar Columns -->
    <rect x="-115" y="45" width="22" height="45" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-opacity="0.5"/>
    <rect x="-75" y="20" width="22" height="70" fill="#10b981" fill-opacity="0.35" stroke="#10b981" stroke-opacity="0.6"/>
    <rect x="-35" y="-15" width="22" height="105" fill="#10b981" fill-opacity="0.45" stroke="#10b981" stroke-opacity="0.7"/>
    <rect x="5" y="-45" width="22" height="135" fill="url(#emeraldGrad2)" stroke="#34d399" stroke-width="1.5" filter="url(#shadow2)"/>
    <rect x="45" y="-20" width="22" height="110" fill="#10b981" fill-opacity="0.45" stroke="#10b981" stroke-opacity="0.7"/>
    <rect x="85" y="-75" width="22" height="165" fill="url(#goldGrad2)" stroke="#fef08a" stroke-width="1.5" filter="url(#shadow2)"/>

    <!-- Capital Budgeting / TVM Exponential Curve -->
    <path d="M -135 75 Q -50 65 0 10 T 130 -90" fill="none" stroke="#fef08a" stroke-width="3" filter="url(#shadow2)"/>
    
    <!-- Discounted Cash Flow Secondary Curve -->
    <path d="M -135 85 Q -30 75 40 -15 T 135 -40" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- Curve Pivot Marker Nodes -->
    <circle cx="0" cy="10" r="5" fill="#eab308" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="85" cy="-55" r="5" fill="#fef08a" stroke="#02211d" stroke-width="1.5"/>
    <circle cx="130" cy="-90" r="6" fill="#10b981" stroke="#ffffff" stroke-width="2"/>

    <!-- Mathematical Financial Formula Overlay Elements -->
    <text x="-120" y="-80" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#10b981" fill-opacity="0.7">NPV = Σ CFt/(1+r)^t</text>
    <text x="-120" y="-60" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#eab308" fill-opacity="0.7">WACC = (E/V)Re + (D/V)Rd(1-Tc)</text>
  </g>

  <!-- Large Course Code Badge -->
  <g transform="translate(44, 115)">
    <rect x="0" y="0" width="82" height="28" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
    <text x="41" y="18" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="2" fill="#34d399" text-anchor="middle">MK 02</text>
  </g>

  <!-- Title & Narrative Typography -->
  <g transform="translate(44, 460)">
    <text font-family="'Lora', Georgia, serif" font-size="25" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Financial</text>
    <text y="32" font-family="'Lora', Georgia, serif" font-size="25" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Management &amp;</text>
    <text y="64" font-family="'Lora', Georgia, serif" font-size="25" font-weight="700" fill="url(#goldGrad2)" letter-spacing="-0.5">Strategy</text>
    
    <text y="92" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.5" fill="#94a3b8">VALUATION • CAPITAL BUDGETING • RISK</text>
    
    <line x1="0" y1="108" x2="392" y2="108" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
    
    <text y="125" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="1" fill="#64748b">LEAD FACULTY</text>
    <text y="139" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">Dr. Arif Zamani</text>
  </g>
</svg>
