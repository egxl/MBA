<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradBonus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19052b"/>
      <stop offset="50%" stop-color="#2e084f"/>
      <stop offset="100%" stop-color="#0f021c"/>
    </linearGradient>
    <linearGradient id="mintGradBonus" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="purpleGradBonus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <radialGradient id="glowBonus" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridBonus" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.04"/>
    </pattern>
    <filter id="shadowBonus" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="640" fill="url(#bgGradBonus)"/>
  <rect width="480" height="640" fill="url(#gridBonus)"/>
  <circle cx="240" cy="290" r="180" fill="url(#glowBonus)"/>

  <!-- Outer Framing -->
  <rect x="20" y="20" width="440" height="600" fill="none" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="24" y="24" width="432" height="592" fill="none" stroke="#34d399" stroke-opacity="0.2" stroke-width="0.5"/>
  <circle cx="20" cy="20" r="3" fill="#c084fc" opacity="0.6"/>
  <circle cx="460" cy="20" r="3" fill="#c084fc" opacity="0.6"/>
  <circle cx="20" cy="620" r="3" fill="#c084fc" opacity="0.6"/>
  <circle cx="460" cy="620" r="3" fill="#c084fc" opacity="0.6"/>

  <!-- Top Header Tag -->
  <g transform="translate(44, 48)">
    <text font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="3" fill="#c084fc" text-anchor="start">SBM ITB • EXECUTIVE ELECTIVE</text>
    <text font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="8" font-weight="600" letter-spacing="2" fill="#94a3b8" text-anchor="end" x="392">QUANTITATIVE MASTERCLASS</text>
    <line x1="0" y1="12" x2="392" y2="12" stroke="#c084fc" stroke-opacity="0.25" stroke-width="1"/>
  </g>

  <!-- Graphic Center: Talent Density Power Law, ONA Network & Compa-Ratio Analytics -->
  <g transform="translate(240, 275)">
    <!-- Mathematical Coordinate Grid Axes -->
    <line x1="-140" y1="85" x2="140" y2="85" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1.5"/>
    <line x1="-140" y1="-100" x2="-140" y2="85" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Gaussian / Power Law Talent Curve -->
    <path d="M -135 80 Q -60 78 -10 15 Q 40 -85 130 -90" fill="none" stroke="#34d399" stroke-width="3" filter="url(#shadowBonus)"/>
    
    <!-- Turnover Cost Exponential Barrier -->
    <path d="M -135 83 Q 0 80 50 30 T 130 -30" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- ONA Network Cluster Nodes -->
    <circle cx="-60" cy="-30" r="6" fill="#9333ea" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="-20" cy="-70" r="5" fill="#34d399" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="20" cy="-45" r="7" fill="#c084fc" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="75" cy="-20" r="5" fill="#9333ea" stroke="#ffffff" stroke-width="1.5"/>

    <line x1="-60" y1="-30" x2="-20" y2="-70" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.2"/>
    <line x1="-20" y1="-70" x2="20" y2="-45" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.2"/>
    <line x1="20" y1="-45" x2="75" y2="-20" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.2"/>
    <line x1="-60" y1="-30" x2="20" y2="-45" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.2"/>

    <!-- Top decile Talent Density Node -->
    <circle cx="130" cy="-90" r="14" fill="url(#mintGradBonus)" filter="url(#shadowBonus)"/>
    <circle cx="130" cy="-90" r="7" fill="#19052b"/>
    <circle cx="130" cy="-90" r="3" fill="#34d399"/>

    <!-- Mathematical Formulation & Annotations -->
    <text x="-120" y="-85" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#34d399" font-weight="600">Output ∝ (Talent Density)ᵅ</text>
    <text x="-120" y="-65" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#c084fc" fill-opacity="0.9">Compa-Ratio = Actual / Midpoint</text>
    <text x="-120" y="115" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#fbbf24" fill-opacity="0.8">Fidelity = (p_transmission)ᴴ</text>
  </g>

  <!-- Large Course Code Badge -->
  <g transform="translate(44, 115)">
    <rect x="0" y="0" width="126" height="28" rx="4" fill="#9333ea" fill-opacity="0.2" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1"/>
    <text x="63" y="18" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="2" fill="#c084fc" text-anchor="middle">BONUS ELECTIVE</text>
  </g>

  <!-- Title & Narrative Typography -->
  <g transform="translate(44, 460)">
    <text font-family="'Lora', Georgia, serif" font-size="30" font-weight="700" fill="#ffffff" letter-spacing="-0.5">PeopleMath</text>
    
    <text y="38" font-family="'Lora', Georgia, serif" font-size="16" font-style="italic" fill="url(#mintGradBonus)" letter-spacing="0.2">Quantitative Talent Modeling</text>
    
    <text y="70" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.5" fill="#94a3b8">TALENT ROI • COMPA-RATIO • ONA &amp; DENSITY</text>
    
    <line x1="0" y1="90" x2="392" y2="90" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1"/>
    
    <text y="110" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="1" fill="#64748b">MODULE TYPE</text>
    <text y="126" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">Executive Masterclass Elective</text>
  </g>
</svg>
