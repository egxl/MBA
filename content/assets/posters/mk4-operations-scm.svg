<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#210a03"/>
      <stop offset="50%" stop-color="#3d1306"/>
      <stop offset="100%" stop-color="#120401"/>
    </linearGradient>
    <linearGradient id="terracottaGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="rustGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <radialGradient id="glow4" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid4" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.04"/>
    </pattern>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="640" fill="url(#bgGrad4)"/>
  <rect width="480" height="640" fill="url(#grid4)"/>
  <circle cx="240" cy="290" r="180" fill="url(#glow4)"/>

  <!-- Outer Framing -->
  <rect x="20" y="20" width="440" height="600" fill="none" stroke="#ea580c" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="24" y="24" width="432" height="592" fill="none" stroke="#f59e0b" stroke-opacity="0.15" stroke-width="0.5"/>
  <circle cx="20" cy="20" r="3" fill="#ea580c" opacity="0.6"/>
  <circle cx="460" cy="20" r="3" fill="#ea580c" opacity="0.6"/>
  <circle cx="20" cy="620" r="3" fill="#ea580c" opacity="0.6"/>
  <circle cx="460" cy="620" r="3" fill="#ea580c" opacity="0.6"/>

  <!-- Top Header Tag -->
  <g transform="translate(44, 48)">
    <text font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="3" fill="#fb923c" text-anchor="start">SBM ITB • P3MD MBA COHORT</text>
    <text font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="8" font-weight="600" letter-spacing="2" fill="#94a3b8" text-anchor="end" x="392">14 WEEKS • 14 CASES • 1 GAME</text>
    <line x1="0" y1="12" x2="392" y2="12" stroke="#ea580c" stroke-opacity="0.25" stroke-width="1"/>
  </g>

  <!-- Graphic Center: SCM Industrial Network, Lean Six Sigma Loop & Process Pipeline -->
  <g transform="translate(240, 280)">
    <!-- Concentric process tracks -->
    <ellipse rx="135" ry="65" fill="none" stroke="#ea580c" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="6 4" transform="rotate(-15)"/>
    <ellipse rx="105" ry="45" fill="none" stroke="#fb923c" stroke-opacity="0.35" stroke-width="1.2" transform="rotate(25)"/>

    <!-- Six Sigma DMAIC Pentagon Loop -->
    <polygon points="0,-95 90,-25 55,80 -55,80 -90,-25" fill="#ea580c" fill-opacity="0.1" stroke="url(#terracottaGrad4)" stroke-width="2" filter="url(#shadow4)"/>

    <!-- Process Stage Nodes -->
    <g transform="translate(0, -95)">
      <circle r="7" fill="#ea580c" stroke="#ffffff" stroke-width="2"/>
      <text y="-14" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#fb923c" text-anchor="middle">DEFINE</text>
    </g>

    <g transform="translate(90, -25)">
      <circle r="7" fill="#ea580c" stroke="#ffffff" stroke-width="2"/>
      <text x="14" y="4" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#fb923c" text-anchor="start">MEASURE</text>
    </g>

    <g transform="translate(55, 80)">
      <circle r="7" fill="#ea580c" stroke="#ffffff" stroke-width="2"/>
      <text x="14" y="4" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#fb923c" text-anchor="start">ANALYZE</text>
    </g>

    <g transform="translate(-55, 80)">
      <circle r="7" fill="#ea580c" stroke="#ffffff" stroke-width="2"/>
      <text x="-14" y="4" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#fb923c" text-anchor="end">IMPROVE</text>
    </g>

    <g transform="translate(-90, -25)">
      <circle r="7" fill="#ea580c" stroke="#ffffff" stroke-width="2"/>
      <text x="-14" y="4" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#fb923c" text-anchor="end">CONTROL</text>
    </g>

    <!-- Center Operations Synchronization Core -->
    <circle cx="0" cy="0" r="16" fill="url(#terracottaGrad4)" filter="url(#shadow4)"/>
    <circle cx="0" cy="0" r="9" fill="#210a03"/>
    <circle cx="0" cy="0" r="4" fill="#fed7aa"/>

    <!-- Queueing & Pipeline Flow Annotations -->
    <text x="-135" y="-120" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#fb923c" fill-opacity="0.75">S&amp;OP • LEAN OPERATIONS • MRP/ERP</text>
    <text x="-135" y="125" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#f59e0b" fill-opacity="0.75">LITTLE'S LAW: WIP = THRU × CT</text>
  </g>

  <!-- Large Course Code Badge -->
  <g transform="translate(44, 115)">
    <rect x="0" y="0" width="82" height="28" rx="4" fill="#ea580c" fill-opacity="0.15" stroke="#ea580c" stroke-opacity="0.4" stroke-width="1"/>
    <text x="41" y="18" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="2" fill="#fb923c" text-anchor="middle">MK 04</text>
  </g>

  <!-- Title & Narrative Typography -->
  <g transform="translate(44, 460)">
    <text font-family="'Lora', Georgia, serif" font-size="25" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Operations &amp;</text>
    <text y="32" font-family="'Lora', Georgia, serif" font-size="25" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Supply Chain</text>
    <text y="64" font-family="'Lora', Georgia, serif" font-size="25" font-weight="700" fill="url(#terracottaGrad4)" letter-spacing="-0.5">Management</text>
    
    <text y="92" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.5" fill="#94a3b8">LEAN SIX SIGMA • CAPACITY • S&amp;OP &amp; LOGISTICS</text>
    
    <line x1="0" y1="108" x2="392" y2="108" stroke="#ea580c" stroke-opacity="0.3" stroke-width="1"/>
    
    <text y="125" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="1" fill="#64748b">LEAD FACULTY</text>
    <text y="139" font-family="'Source Sans Pro', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">Noorhan Firdaus Pambudi, Ph.D.</text>
  </g>
</svg>
